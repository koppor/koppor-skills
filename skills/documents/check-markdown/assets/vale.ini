# Vale configuration for the check-markdown skill.
# Docs: https://vale.sh/docs/topics/config
#
# `vale sync` downloads the packages listed below into StylesPath (run once; the
# check-md.mjs runner does this automatically when styles/ is empty).

StylesPath = styles
MinAlertLevel = warning

# Official packages: https://vale.sh/hub
Packages = write-good, proselint, Readability

[*.md]
# `Vale` is the built-in base style; the others come from Packages above.
BasedOnStyles = Vale, write-good, proselint
